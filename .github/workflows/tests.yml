# Runs the test suite on every push and pull request, under a virtual display so that the window's
# self-test (every page, both languages, the example import) runs too.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y -q xvfb
      - run: python -m pip install "pytest>=8"
      - run: xvfb-run -a python -m pytest -q -rs
