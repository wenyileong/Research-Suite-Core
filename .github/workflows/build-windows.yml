# Builds ResearchSuite.exe on GitHub's Windows runners when a tag like v0.2.0 is pushed, or on demand
# from the Actions tab. The result is uploaded as an artifact (a zip with the exe, the quick-start note,
# the licence and the third-party notices).
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "pyinstaller>=6.10,<7" "pytest>=8"
      - name: Test
        shell: pwsh
        run: |
          # Failures are also reported as annotations, readable from the run summary and the API.
          # The window's self-test runs below on the packaged exe, which carries its own Tcl/Tk; in-process
          # Tk on the runner's Python cannot always find init.tcl, so that one test is left to the exe here.
          # It also runs in the tests workflow on Linux.
          python -m pytest -q -rfE --tb=line -p no:cacheprovider -k "not test_window_self_test" 2>&1 | Tee-Object -FilePath pytest.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path pytest.log -Pattern "^(FAILED|ERROR)|Error:|assert" |
              Select-Object -First 20 | ForEach-Object { Write-Output ("::error title=Test::" + $_.Line) }
            exit 1
          }
      - name: Build
        run: pyinstaller --noconfirm --clean packaging\research_suite.spec --distpath dist --workpath build
      - name: Smoke test
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Smoke test::$($_.Exception.Message)"; exit 1 }
          # The self-test opens every page in both languages and runs the example import. It is given
          # three minutes; a hung exe is stopped and fails the build rather than waiting for ever.
          $log = Join-Path $env:RUNNER_TEMP "self_test.log"
          $p = Start-Process -FilePath dist\ResearchSuite.exe -ArgumentList "--self-test","--log",$log -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test did not finish within 3 minutes" }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Output $_ } }
          if ($p.ExitCode -ne 0) {
            $first = if (Test-Path $log) { (Get-Content $log | Select-Object -Last 1) } else { "no log" }
            throw "self-test failed (exit code $($p.ExitCode)): $first"
          }
          $p = Start-Process -FilePath dist\ResearchSuite.exe -ArgumentList "--version" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "--version did not finish" }
          if ($p.ExitCode -ne 0) { throw "--version failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Package::$($_.Exception.Message)"; exit 1 }
          $v = (python -c "import sys; sys.path.insert(0, 'src'); import rscore; print(rscore.__version__)").Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\ResearchSuite.exe, packaging\READ_ME_FIRST.txt release\
          Copy-Item LICENSE release\LICENSE.txt
          python packaging\third_party_notices.py release\THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw "third-party notices incomplete" }
          Compress-Archive -Path release\* -DestinationPath "ResearchSuite-$v-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ResearchSuite-windows
          path: ResearchSuite-*-windows.zip
  # Also keeps the latest zip on the windows-build branch (one commit, replaced each time), so it can be
  # fetched with git where GitHub's artifact storage is not reachable.
  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ResearchSuite-windows
          path: out
      - name: Commit to windows-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b windows-build
          git config user.name wenyileong
          git config user.email wenyileong@users.noreply.github.com
          printf 'Latest Windows build of the Research Suite launcher, from commit %s.\n' "${GITHUB_SHA}" > README.txt
          git add -A
          git commit -q -m "Windows build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windows-build
